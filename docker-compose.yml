services:
  frontend:
    build:
      context: ./office-reservation-front
    image: ${DOCKER_IMAGE_PREFIX:-office-reservation}-frontend:${IMAGE_TAG:-latest}
    container_name: office_reservation_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - office-reservation-net

  backend:
    build:
      context: ./OfficeReservation
    image: ${DOCKER_IMAGE_PREFIX:-office-reservation}-backend:${IMAGE_TAG:-latest}
    container_name: office_reservation_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JWT_SECRET: ${SPRING_JWT_SECRET}
      JWT_SECRET: ${SPRING_JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-office_reservation}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      MYSQL_USER: ${MYSQL_USER:-office}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      FILE_UPLOAD_PATH: /app/uploads/images/resources/
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - resource-images:/app/uploads/images/resources
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - office-reservation-net

  mysql:
    image: mysql:8.4
    container_name: office_reservation_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-office_reservation}
      MYSQL_USER: ${MYSQL_USER:-office}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - office-reservation-net

networks:
  office-reservation-net:

volumes:
  mysql-data:
  resource-images:
